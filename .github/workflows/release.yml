name: release
# Publishes to PyPI when a version tag is pushed (git tag v0.1.0 && git push origin v0.1.0). No token: PyPI trusted publishing
# (pending publisher: project yhatlabs, repo yhatlabs/yhatlabs-python, workflow release.yml, environment pypi).
on:
  push:
    tags: ["v*"]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - name: Tag matches the package version
        run: test "v$(grep -oP '__version__ = "\K[^"]+' src/yhatlabs/_version.py)" = "${GITHUB_REF_NAME}"
      - run: uv venv && uv pip install -e ".[dev]" && uv run --no-sync pytest -q -m "not live"
      - run: uv build
      - uses: actions/upload-artifact@v7
        with: { name: dist, path: dist/ }
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with: { name: dist, path: dist/ }
      - uses: pypa/gh-action-pypi-publish@release/v1
